# 与 phira-mp-server 的 server_config.yml 等价
monitors:
  - 2

# 玩家连接服务器时展示的公告（每条一行聊天消息）
announcements:
  - "欢迎来到 Phira 多人服务器"
  - "房间名以 _ 开头时不会出现在在线房间列表中"

# 连接时是否展示在线房间列表
show_online_rooms: true
# 是否允许玩家在客户端创建房间；控制台、QQ 指令和 HTTP API 建房不受此开关影响
allow_client_create_room: true

# HTTP API：供 AstrBot 等外部程序查询和管理服务器
# 修改后需要重启服务器生效
api:
  # 是否启用
  enabled: true
  # 监听地址；AstrBot 与服务器不在同一台机器时改为 0.0.0.0
  host: "127.0.0.1"
  # 监听端口
  port: 3052
  # 访问令牌；仅对下方 protected_paths 匹配的接口生效
  access_token: ""
  # 需要携带 token 才能访问的接口（默认全部公开）
  # 每行一项，支持 "METHOD /path" 或 "/path"（任意方法），* 为通配符
  # 示例：
  #   - POST /api/announce
  #   - POST /api/rooms/*
  #   - /api/login/*
  protected_paths: []
  # 优先级更高的公开接口，即使命中 protected_paths 也不校验 token
  public_paths: []

# Phira 账号绑定（QQ 用户通过一次性链接登录 Phira）
# 公网访问路径由反向代理负责，例如把 https://你的域名/login/ 反代到 http://127.0.0.1:3052/login/
login:
  # 是否启用账号绑定
  enabled: true
  # 生成登录链接时使用的公网地址（末尾不要带 /）
  public_url: "https://phira.lisongyun.top"
  # 登录链接有效期（秒）
  link_ttl: 600
  # 单个链接允许的密码尝试次数
  max_attempts: 5
  # QQ/Phira 绑定数据文件（不会保存密码或 Phira token）
  bindings_file: "data/bindings.json"
  # 调用 Phira /login 时上报的客户端版本与渠道
  client_version: "0.6.7"
  client_flavor: "none"

# QQ 机器人（NapCat 反向 WebSocket：NapCat 连接本服务器）
# 接入 AstrBot 后建议将 enabled 设为 false，避免两个机器人重复回复
qq_bot:
  enabled: true
  # 本服务器监听的 WebSocket 端口，NapCat 里填 ws://服务器地址:3001
  port: 3001
  # 可选，和 NapCat 的 access token 保持一致；留空表示不校验
  access_token: ""
  # 允许管理房间的 QQ 号（创建房间、管理消息、公告）
  admin_qq:
    - 10001
  # 定时推送在线房间的 QQ 群号
  group_ids:
    - 123456
  # 推送间隔（秒），0 表示关闭定时推送
  report_interval: 300
